<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meeting Scheduler</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <main class="container">
      <h1>Meeting Scheduler</h1>
      <p class="subtitle">Plan meetings in a few clicks.</p>

      <form action="{{ url_for('add_meeting') }}" method="post" class="meeting-form">
        <label for="title">Meeting Title</label>
        <input id="title" name="title" type="text" placeholder="Team Sync" required />

        <div class="row">
          <div>
            <label for="date">Date</label>
            <input id="date" name="date" type="date" required />
          </div>
          <div>
            <label for="time">Time</label>
            <input id="time" name="time" type="time" required />
          </div>
        </div>

        <button type="submit">Add Meeting</button>
      </form>

      <section class="meetings">
        <h2>Scheduled Meetings</h2>

        {% if meetings %}
        <ul>
          {% for meeting in meetings %}
          <li class="meeting-row">
            <div>
              <strong>{{ meeting.title }}</strong>
              <p>{{ meeting.date }} • {{ meeting.time }}</p>
            </div>
            <form action="{{ url_for('delete_meeting', meeting_id=meeting.id) }}" method="post">
              <button type="submit" class="delete-btn">Delete</button>
            </form>
          </li>
          {% endfor %}
        </ul>
        {% else %}
        <p class="empty-state">No meetings yet. Add your first one above.</p>
        {% endif %}
      </section>
    </main>
  </body>
</html>
